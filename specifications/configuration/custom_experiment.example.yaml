experiment:
  id: custom_tariff_replication
  mode: custom

dataset:
  path: data/my_customs.csv
  analysis_unit: item_id
  grouping_unit: declaration_id
  description_column: product_description
  label_column: tariff_code

classification:
  family: HS
  jurisdiction: XX
  nomenclature: national_tariff
  target_digits: 10
  hierarchy_digits: [2, 4, 6, 8, 10]

scope:
  chapters: null

split:
  strategy: grouped
  train_ratio: 0.70
  dev_ratio: 0.10
  eval_ratio: 0.20
  seed: 2026

retrieval:
  historical:
    enabled: true
    method: bm25
  normative:
    enabled: true
    corpus_id: my_normative_corpus

normative:
  jurisdiction: XX
  nomenclature: national_tariff
  supported_digits: [2, 4, 6, 8, 10]

llm:
  diagnostic_reranker_enabled: false
  controlled_explainer_enabled: false

reporting:
  case_level_results: true
  reproducibility_manifest: true
