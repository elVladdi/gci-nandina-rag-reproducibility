experiment:
  id: custom_tariff_replication
  mode: custom

dataset:
  path: data/my_customs.csv
  analysis_unit: item_id
  grouping_unit: declaration_id
  description_column: product_description
  label_column: tariff_code

classification:
  family: HS
  jurisdiction: CL
  nomenclature: national_tariff
  target_digits: 10
  hierarchy_digits: [2, 4, 6, 8, 10]

scope:
  # null means all chapters represented in the dataset.
  # Use a list such as [84, 85] to restrict the experimental scope.
  chapters: null

split:
  strategy: grouped
  train_ratio: 0.70
  dev_ratio: 0.10
  eval_ratio: 0.20
  seed: 2026

retrieval:
  historical:
    enabled: true
    method: bm25

  normative:
    enabled: true
    corpus_path: data/normative/my_jurisdiction/
    jurisdiction: CL
    nomenclature: national_tariff
    supported_digits: [2, 4, 6, 8, 10]

llm:
  reranker_enabled: false
  explainer_enabled: false

output:
  directory: results/custom_tariff_replication
